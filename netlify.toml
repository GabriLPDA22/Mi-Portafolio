[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------
# Cabeceras de seguridad
# ---------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Assets con hash en el nombre: caché inmutable de 1 año.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ---------------------------------------------------------------
# Redirecciones 301 (URLs del portfolio anterior y variantes)
# ---------------------------------------------------------------
[[redirects]]
  from = "/diseño-web-zaragoza"
  to = "/diseno-web-zaragoza"
  status = 301
  force = true

[[redirects]]
  from = "/dise%C3%B1o-web-zaragoza"
  to = "/diseno-web-zaragoza"
  status = 301
  force = true

[[redirects]]
  from = "/servicios/mantenimiento-web"
  to = "/mantenimiento-web"
  status = 301

[[redirects]]
  from = "/proyecto/*"
  to = "/proyectos"
  status = 301

[[redirects]]
  from = "/privacy-policy"
  to = "/politica-privacidad"
  status = 301

[[redirects]]
  from = "/carta-recomendacion"
  to = "/"
  status = 301

[[redirects]]
  from = "/dashboard"
  to = "/"
  status = 301

[[redirects]]
  from = "/cv.pdf"
  to = "/"
  status = 301
